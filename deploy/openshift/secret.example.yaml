# MODELO. Não commite o arquivo com valores reais: crie o Secret direto no cluster, por exemplo:
#   oc create secret generic taiga-dev-view-back \
#     --from-literal=TAIGA_SERVICE_USER='svc-taiga-dev-view' \
#     --from-literal=TAIGA_SERVICE_PASSWORD='...' \
#     --from-literal=INTERNAL_API_KEY="$(openssl rand -hex 32)"
# O MESMO valor de INTERNAL_API_KEY precisa estar no Secret do front (chave API_KEY).
apiVersion: v1
kind: Secret
metadata:
  name: taiga-dev-view-back
  labels: { app: taiga-dev-view-back }
type: Opaque
stringData:
  TAIGA_SERVICE_USER: "svc-taiga-dev-view"
  TAIGA_SERVICE_PASSWORD: "troque-esta-senha"
  INTERNAL_API_KEY: "gere-com-openssl-rand-hex-32"
